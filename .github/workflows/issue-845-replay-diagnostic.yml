name: Issue 845 replay diagnostic

on:
  pull_request:
    branches:
      - dev-cad
    paths:
      - ".github/workflows/issue-845-replay-diagnostic.yml"
      - "scripts/issue_845_replay_diagnostic.py"
      - "examples/sheet-contour-flange-recess/**"
      - "scpf/scpf/**"

permissions:
  contents: read

jobs:
  replay:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset_url: https://github.com/tangency-labs/solidcraft/releases/download/v0.48.1/solidcraft-0.48.1-linux-x86_64.tar.gz
          - os: windows-latest
            asset_url: https://github.com/tangency-labs/solidcraft/releases/download/v0.48.1/solidcraft-0.48.1-windows-x64-portable.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Forge package
        run: python -m pip install -e scpf

      - name: Run #845 replay A/B
        run: >
          python scripts/issue_845_replay_diagnostic.py
          --asset-url "${{ matrix.asset_url }}"
          --output diagnostic-845

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-845-${{ runner.os }}
          path: diagnostic-845
          if-no-files-found: error
          retention-days: 7
