name: Merge policy

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  merge:
    if: >-
      github.event.issue.pull_request &&
      (github.event.comment.body == '/merge' ||
       startsWith(github.event.comment.body, '/merge-resolved')) &&
      github.actor == github.repository_owner
    permissions:
      actions: write
      contents: write
      pull-requests: write
      issues: write
      checks: read
      statuses: read
    uses: brainboxemb/tool.cad.ci/.github/workflows/reusable-merge-policy.yml@27bdf67077ddd485cea95ba199069249c20c2a46
    with:
      command: ${{ github.event.comment.body }}
      pull_request_number: ${{ github.event.issue.number }}
      stable_branch: main
      development_branches: '["dev-cad","dev-ci"]'
      permanent_branches: '["build","gh-pages"]'
      temporary_branch_prefixes: '["issue/","fix/","feature/","accept/","promote/","docs/","chore/"]'
      integration_workflow: scpf.yml
