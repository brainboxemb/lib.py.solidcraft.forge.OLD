name: Merge policy

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  merge:
    if: >-
      github.event.issue.pull_request &&
      github.event.comment.body == '/merge' &&
      github.actor == github.repository_owner
    permissions:
      actions: write
      contents: write
      pull-requests: write
      issues: write
      checks: read
      statuses: read
    uses: brainboxemb/tool.cad.ci/.github/workflows/reusable-merge-policy.yml@eb64a46b243db00e8dbb4b78b6643a2a7efa3fb9
    with:
      command: ${{ github.event.comment.body }}
      pull_request_number: ${{ github.event.issue.number }}
      stable_ref: main
      lane_refs_json: '["dev-cad","dev-ci"]'
      permanent_refs_json: '["build","gh-pages"]'
      temporary_prefixes_json: '["issue/","fix/","feature/","accept/","promote/","docs/","chore/"]'
      integration_workflow: scpf.yml
