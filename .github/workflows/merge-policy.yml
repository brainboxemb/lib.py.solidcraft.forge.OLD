# template: tool.cad.ci/merge-policy
# template-version: 4
# tool-release: v0.35.0
#
# Copied from the released tool.cad.ci consumer template.
# Forge changes only the explicitly repository-owned policy below.

name: Merge policy

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  merge:
    if: >-
      github.event.issue.pull_request &&
      (github.event.comment.body == '/merge' ||
       startsWith(github.event.comment.body, '/merge-resolved'))
    permissions:
      actions: write
      contents: write
      pull-requests: write
      issues: write
      checks: read
      statuses: read
    uses: brainboxemb/tool.cad.ci/.github/workflows/reusable-merge-policy.yml@v0.35.0
    with:
      command: ${{ github.event.comment.body }}
      pull_request_number: ${{ github.event.issue.number }}

      # Repository policy.
      stable_branch: main
      development_branches: '["dev-cad","dev-ci"]'
      permanent_branches: '["build","gh-pages"]'
      integration_workflow: scpf.yml
