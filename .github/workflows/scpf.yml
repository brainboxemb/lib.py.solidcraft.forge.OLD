# template: tool.cad.ci/cad-ci-lanes
# template-version: 5
# tool-release: v0.35.0
#
# Copied from the released tool.cad.ci consumer template.
# Forge changes only repository-owned policy values and jobs=2.
# During #740 staged migration, the PR call carries one temporary targeted
# selector. Remove it before the final full-catalog gate.

name: Forge

on:
  pull_request:
    branches: [main, dev-cad, dev-ci]
    types: [opened, synchronize, reopened]
  push:
    branches: [main, dev-cad, dev-ci]
  workflow_dispatch:
    inputs:
      item:
        description: Optional exact CAD-CI item id for a read-only targeted qualification run.
        required: false
        type: string
        default: ""
      changed_paths:
        description: Optional JSON list of repository-relative paths for multi-item targeted qualification.
        required: false
        type: string
        default: ""

permissions:
  contents: read
  packages: read

jobs:
  probe:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (inputs.item != '' || inputs.changed_paths != '')
    uses: brainboxemb/tool.cad.ci/.github/workflows/reusable-ci.yml@v0.35.0
    with:
      source_sha: ${{ github.sha }}
      item: ${{ inputs.item }}
      changed_paths: ${{ inputs.changed_paths }}
      jobs: 2

  pr:
    if: github.event_name == 'pull_request'
    uses: brainboxemb/tool.cad.ci/.github/workflows/reusable-ci.yml@v0.35.0
    with:
      # #740 staged migration gate 1: one representative model.
      # Replace with changed_paths for gates 5/10; remove for the final full gate.
      item: simple-box
      pull_request_policy: '{"stable_branch":"main","development_branches":["dev-cad","dev-ci"],"docs_only_prefixes":["docs/"]}'
      jobs: 2

  durable:
    if: >-
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' &&
        inputs.item == '' &&
        inputs.changed_paths == '')) &&
      (github.ref_name == 'main' ||
       github.ref_name == 'dev-cad' ||
       github.ref_name == 'dev-ci')
    permissions:
      contents: write
      packages: read
    uses: brainboxemb/tool.cad.ci/.github/workflows/reusable-durable.yml@v0.35.0
    with:
      source_sha: ${{ github.sha }}
      source_ref: ${{ github.ref_name }}
      scope: ${{ github.ref_name }}
      build_branch: build
      pages_branch: gh-pages
      jobs: 2
