# template: tool.cad.ci/cad-ci-lanes
# template-version: 5
# tool-release: v0.35.0
#
# Copied from the released tool.cad.ci consumer template.
# Forge changes only repository-owned policy values and jobs=2.

name: Forge

on:
  pull_request:
    branches: [main, dev-cad, dev-ci]
    types: [opened, synchronize, reopened]
  push:
    branches: [main, dev-cad, dev-ci]
  workflow_dispatch:
    inputs:
      item:
        description: Optional exact CAD-CI item id for a read-only targeted qualification run.
        required: false
        type: string
        default: ""
      changed_paths:
        description: Optional JSON list of repository-relative paths for multi-item targeted qualification.
        required: false
        type: string
        default: ""

permissions:
  contents: read
  packages: read

jobs:
  probe:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (inputs.item != '' || inputs.changed_paths != '')
    uses: brainboxemb/tool.cad.ci/.github/workflows/reusable-ci.yml@v0.35.0
    with:
      source_sha: ${{ github.sha }}
      item: ${{ inputs.item }}
      changed_paths: ${{ inputs.changed_paths }}
      jobs: 2

  pr:
    if: github.event_name == 'pull_request'
    uses: brainboxemb/tool.cad.ci/.github/workflows/reusable-ci.yml@v0.35.0
    with:
      pull_request_policy: '{"stable_branch":"main","development_branches":["dev-cad","dev-ci"],"docs_only_prefixes":["docs/"]}'
      jobs: 2

  durable:
    if: >-
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' &&
        inputs.item == '' &&
        inputs.changed_paths == '')) &&
      (github.ref_name == 'main' ||
       github.ref_name == 'dev-cad' ||
       github.ref_name == 'dev-ci')
    permissions:
      contents: write
      packages: read
    uses: brainboxemb/tool.cad.ci/.github/workflows/reusable-durable.yml@v0.35.0
    with:
      source_sha: ${{ github.sha }}
      source_ref: ${{ github.ref_name }}
      scope: ${{ github.ref_name }}
      build_branch: build
      pages_branch: gh-pages
      jobs: 2


  issue_845_replay:
    if: >-
      github.event_name == 'pull_request' &&
      github.head_ref == 'issue/845-live-sheet-recess'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset_url: https://github.com/tangency-labs/solidcraft/releases/download/v0.48.1/solidcraft-0.48.1-linux-x86_64.tar.gz
          - os: windows-latest
            asset_url: https://github.com/tangency-labs/solidcraft/releases/download/v0.48.1/solidcraft-0.48.1-windows-x64-portable.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Forge package
        run: python -m pip install -e scpf

      - name: Run #845 replay A/B
        run: >
          python scripts/issue_845_replay_diagnostic.py
          --asset-url "${{ matrix.asset_url }}"
          --output diagnostic-845

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-845-${{ runner.os }}
          path: diagnostic-845
          if-no-files-found: error
          retention-days: 7
