# Forge CI items and repository-wide runtime expectation.
schema: 1

variables:
  FORGE_RUNTIME_IMAGE: "ghcr.io/brainboxemb/cad-solidcraft:v0.3.5"
  REFERENCE_RUNTIME_IMAGE: "ghcr.io/brainboxemb/cad-reference:v0.3.5"
  SOLIDCRAFT_VERSION: "0.48.1"

runtimes:
  reference: "ghcr.io/brainboxemb/cad-reference:v0.3.5"

verification:
  package:
    repository: brainboxemb/lib.py.cad.verification
    version: "0.16.0"
    commit: c7c145b7be0c602724e8cca874ef29990baaad1e

builders:
  forge-model: ci/builders/forge-model
  forge-package: ci/builders/forge-package
  forge-tests: ci/builders/forge-tests
  forge-release: ci/builders/forge-release
  release-policy: ci/builders/release-policy
  site-source: ci/builders/site-source
  solidcraft-reference: ci/builders/solidcraft-reference
  model-verification-batch: ci/builders/model-verification-batch
  reference-verification-batch: ci/builders/reference-verification-batch
  forge-reference-projection: ci/builders/forge-reference-projection
  verification-diagrams: ci/builders/verification-diagrams
  pages-site: ci/builders/pages-site

publication:
  pages:
    builder: pages-site
    output: site

templates:
  forge-model-declarative:
    kind: model
    needs:
      - forge-package
      - model-verification-batch
    watch:
      item:
        - scpf/**
        - verification/**
        - tests/**
      repo:
        - scripts/forge_example.py
        - scripts/model_contract_test.py
        - scripts/model_verify_declarative.py
        - scripts/model_verification_batch.py
        - scripts/model_visual.py
    strategy:
      reuse: true
    builder: forge-model

  forge-reference:
    kind: verification
    needs:
      - reference-verification-batch
    watch:
      item:
        - model.py
        - ../verification/reference_geometry.json
      repo:
        - verification/reference_validation.py
        - verification/reference_preview.py
        - verification/tests/test_reference_preview.py
        - scripts/forge_example.py
        - scripts/reference_verification_batch.py
    strategy:
      reuse: true
    builder: forge-reference-projection

  forge-reference-cadquery:
    kind: verification
    builder: cadquery
    verification:
      adapter: mesh-geometry
      definition: ../verification/reference_geometry.json
    watch:
      item:
        - model.py
        - ../verification/reference_geometry.json
    strategy:
      reuse: true

  forge-reference-build123d:
    kind: verification
    builder: build123d
    verification:
      adapter: mesh-geometry
      definition: ../verification/reference_geometry.json
    watch:
      item:
        - model.py
        - ../verification/reference_geometry.json
    strategy:
      reuse: true

items:
  - scpf
  - ci/*
  - examples/*
  - examples/*/*
