schema: 1
description: Forge model contract test plus shared verified-model projection.

steps:
  - id: contract_test
    inputs:
      item:
        - scpf/**
        - tests/**
      repo:
        - scripts/forge_example.py
        - scripts/model_contract_test.py
    run: 'python "$CAD_CI_BUILDER_PATH/../../../scripts/model_contract_test.py"'
  - id: model_verify
    copy:
      dependency: model-verification-batch
      source: items/{item_path}
    outputs:
      - solidcraft.json
      - model_verify
