schema: 1
description: Release-verify the exact built Forge package.

steps:
  - id: tool_verify
    inputs:
      - ci/forge-release/ci.yml
      - CHANGELOG.md
      - scpf/scpf/**
      - scpf/pyproject.toml
      - scripts/tool_verify.py
      - scripts/model_selection.py
      - scripts/forge_example.py
      - examples/*/model.yml
      - examples/*/scpf/**
      - examples/*/tests/**
    run: [python, ../../scripts/tool_verify.py]
    outputs: [tool_verify]
