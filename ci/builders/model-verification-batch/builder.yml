schema: 1
description: Produce active native SolidCraft model verification in one shared runtime batch.

steps:
  - id: verify_models
    selection_context: direct_dependents
    inputs:
      - examples/*/ci.yml
      - examples/*/scpf/**
      - examples/*/verification/**
      - scripts/forge_example.py
      - scripts/model_verify_declarative.py
      - scripts/model_verification_batch.py
      - scripts/model_visual.py
      - scpf/scpf/version.py
    run: [python, ../../scripts/model_verification_batch.py, batch]
    outputs:
      - items
