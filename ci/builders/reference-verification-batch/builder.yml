schema: 1
description: Produce Forge-owned independent reference/presentation batch output.
verification_package: true

steps:
  - id: verify_references
    inputs:
      - examples/*/ci.yml
      - examples/*/verification/reference_geometry.json
      - examples/*/pybosl2/**
      - examples/*/pythonscad/**
      - verification/cases/*/ci.yml
      - verification/cases/*/verification/reference_geometry.json
      - verification/cases/*/pybosl2/**
      - verification/cases/*/pythonscad/**
      - verification/regressions/*/ci.yml
      - verification/regressions/*/verification/reference_geometry.json
      - verification/regressions/*/pybosl2/**
      - verification/regressions/*/pythonscad/**
      - scripts/forge_example.py
      - scripts/reference_verification_batch.py
      - verification/reference_validation.py
      - verification/reference_preview.py
      - verification/tests/test_reference_preview.py
      - scripts/build_diagrams.py
      - verification/diagrams/sources/**
    run: [python, ../../scripts/reference_verification_batch.py, batch]
    outputs:
      - items
      - diagrams
