schema: 1
description: Validate Forge-specific release rules and shared release wrapper.

steps:
  - id: test_release_validator
    inputs:
      - .github/workflows/release.yml
      - ci/forge-release/ci.yml
      - scripts/release/validate_release.py
      - scripts/release/test_validate_release.py
      - docs/release.md
    run: [python, ../../scripts/release/test_validate_release.py]
