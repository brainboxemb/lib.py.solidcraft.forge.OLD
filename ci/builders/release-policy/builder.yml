schema: 1
description: Validate Forge release policy without CAD runtimes.

steps:
  - id: test_release_validator
    inputs:
      - .github/workflows/release.yml
      - ci/forge-release/ci.yml
      - scripts/release/**
      - docs/release.md
    run: [python, ../../scripts/release/test_validate_release.py]
  - id: test_release_publisher
    inputs:
      - .github/workflows/release.yml
      - scripts/release/**
      - docs/release.md
    run: [python, ../../scripts/release/test_publish_release.py]
