schema: 1
description: Verify the checked SolidCraft command reference against the pinned runtime.

steps:
  - id: verify_registry
    inputs:
      - docs/reference/solidcraft/**
      - scripts/capture_solidcraft_reference.py
      - scripts/verify_solidcraft_reference_runtime.py
    run:
      - python
      - ../../scripts/verify_solidcraft_reference_runtime.py
      - --image
      - ghcr.io/brainboxemb/cad-solidcraft:v0.3.5
      - --version
      - 0.48.1
      - --snapshot
      - docs/reference/solidcraft/0.48.1/commands.json
