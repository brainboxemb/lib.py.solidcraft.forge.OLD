# Forge repository CI item: prepare the exact released CAD-verification package.
# Owner boundary: Forge pins/transports the dependency; generic verification lives in lib.py.cad.verification.
# Local documentation: README.md
id: cad-verification-package
kind: tool
watch:
  - ci/cad-verification-package/package.json
  - scripts/verification_package.py
strategy:
  reuse: true
steps:
  - id: package_build
    inputs:
      - ci/cad-verification-package/package.json
      - scripts/verification_package.py
    run: [python, ../../scripts/verification_package.py]
    outputs:
      - dist
      - provenance.json
