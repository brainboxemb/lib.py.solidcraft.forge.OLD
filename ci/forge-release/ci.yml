# Forge repository CI item: release-verify the exact built Forge package.
# This is verification only; publication policy is documented separately in docs/release.md.
# Local documentation: README.md
id: forge-release
kind: verification
needs:
  - forge-package
watch:
  - ci/forge-release/ci.yml
  - CHANGELOG.md
  - scpf/scpf/**
  - scpf/pyproject.toml
  - scripts/tool_verify.py
  - scripts/forge_example.py
  - examples/simple-box/scpf/**
  - examples/simple-box/tests/**
  - examples/anchored-holes/scpf/**
  - examples/anchored-holes/tests/**
  - examples/components/scpf/**
  - examples/components/tests/**
  - examples/corner-anchor/scpf/**
  - examples/corner-anchor/tests/**
  - examples/custom-anchor/scpf/**
strategy:
  reuse: true
builder: forge-release
