# Forge repository CI item: run the Forge test suite against the exact built package.
# Generic selection/scheduling/caching remain owned by the released CAD-CI stack.
# Local documentation: README.md
id: forge-tests
kind: tool
needs:
  - forge-package
watch:
  - .github/workflows/scpf.yml
  - .github/workflows/merge-policy.yml
  - scpf/scpf/**
  - scpf/tests/**
  - scpf/pyproject.toml
  - scripts/tool_ci.py
  - scripts/forge_example.py
  - scripts/qualification_summary.py
  - scripts/merge_policy.py
strategy:
  reuse: true
builder: forge-tests
