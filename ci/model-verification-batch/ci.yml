# Forge repository CI item: produce active native SolidCraft model verification in one shared runtime batch.
# Forge owns model expectations; generic verification remains in lib.py.cad.verification.
# Local documentation: README.md
id: model-verification-batch
process: true
kind: verification
needs:
  - forge-package
  - cad-ci-verification-package
watch:
  - scripts/forge_example.py
  - scripts/model_verify_declarative.py
  - scripts/model_verification_batch.py
  - scripts/model_visual.py
strategy:
  reuse: true
builder: model-verification-batch
