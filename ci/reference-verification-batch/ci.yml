# Forge repository CI item: produce active independent CAD references in one shared reference-runtime batch.
# Runtime packaging and generic verification remain in their owner repositories.
# Local documentation: README.md
id: reference-verification-batch
process: true
kind: verification
needs:
  - cad-verification-package
watch:
  - scripts/forge_example.py
  - scripts/reference_verification_batch.py
  - verification/reference_validation.py
  - verification/reference_preview.py
  - verification/tests/test_reference_preview.py
  - verification/build123d_export.py
  - scripts/build_diagrams.py
  - verification/diagrams/sources/**
strategy:
  reuse: true
builder: reference-verification-batch
