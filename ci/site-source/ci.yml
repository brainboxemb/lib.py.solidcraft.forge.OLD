# Forge repository CI item: validate site source and model-owned presentation metadata without CAD runtimes.
# This validates distributed metadata; it is not a second model catalog.
# Local documentation: README.md
id: site-source
process: true
kind: test
watch:
  - site/**
  - .github/workflows/scpf.yml
  - examples/*/model.yml
  - examples/*/README.md
  - examples/*/role.yml
  - examples/README.md
strategy:
  reuse: true
builder: site-source
