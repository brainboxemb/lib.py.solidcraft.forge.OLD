# Forge repository CI item: verify the checked SolidCraft command reference against the immutable runtime.
# Runtime images are owned/released by docker.cad.solidcraft; Forge is a consumer.
# Local documentation: README.md
id: solidcraft-reference
process: true
kind: verification
watch:
  - docs/reference/solidcraft/**
  - scripts/capture_solidcraft_reference.py
  - scripts/verify_solidcraft_reference_runtime.py
strategy:
  reuse: true
builder: solidcraft-reference
