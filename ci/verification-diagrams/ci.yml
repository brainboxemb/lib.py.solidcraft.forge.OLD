# Forge repository CI item: expose verification diagrams produced by the shared reference batch.
# This item copies existing batch output; it does not start a second renderer/runtime.
# Local documentation: README.md
id: verification-diagrams
process: true
kind: verification
needs:
  - reference-verification-batch
watch:
  - verification/diagrams/sources/**
  - scripts/build_diagrams.py
  - scripts/reference_verification_batch.py
strategy:
  reuse: true
builder: verification-diagrams
