# SolidCraft model verification for anchor-topology-mutation.
id: anchor-topology-mutation
process: true
kind: model
needs:
  - forge-package
  - model-verification-batch
watch:
  - examples/anchor-topology-mutation/scpf/**
  - examples/anchor-topology-mutation/verification/**
  - examples/anchor-topology-mutation/tests/**
  - scripts/forge_example.py
  - scripts/model_contract_test.py
  - scripts/model_verify_declarative.py
  - scripts/model_verification_batch.py
  - scripts/model_visual.py
strategy:
  reuse: true
steps:
  - id: contract_test
    inputs:
      - examples/anchor-topology-mutation/scpf/**
      - examples/anchor-topology-mutation/tests/**
      - scripts/forge_example.py
      - scripts/model_contract_test.py
    run: [python, ../../scripts/model_contract_test.py]
  - id: model_verify
    copy:
      dependency: model-verification-batch
      source: items/{item_path}
    outputs:
      - solidcraft.json
      - model_verify
