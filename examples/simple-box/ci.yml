# SolidCraft model verification for the first migrated historical model.
id: simple-box
process: true
kind: model
needs:
  - forge-package
  - model-verification-batch
watch:
  - examples/simple-box/scpf/**
  - examples/simple-box/verification/**
  - examples/simple-box/tests/**
  - scripts/forge_example.py
  - scripts/model_contract_test.py
  - scripts/model_verify_declarative.py
  - scripts/model_verification_batch.py
  - scripts/model_visual.py
strategy:
  reuse: true
steps:
  - id: contract_test
    inputs:
      - examples/simple-box/scpf/**
      - examples/simple-box/tests/**
      - scripts/forge_example.py
      - scripts/model_contract_test.py
    run: [python, ../../scripts/model_contract_test.py]
  - id: model_verify
    copy:
      dependency: model-verification-batch
      source: items/{item_path}
    outputs:
      - solidcraft.json
      - model_verify
