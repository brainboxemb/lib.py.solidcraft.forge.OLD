section: features
priority: 70
title: Native sketch Slot family
tagline: All five SolidCraft Slot construction methods live in one explicit sketch
description: >
  One plate sketch contains five closed Slot profiles created with the five native Slot construction methods and removed with one through cut.
parameters: 160 × 120 × 5 mm plate; editable straight-Slot position/length and 8 mm native Slot width
stages:
  - Create the native Box plate
  - Create three straight native Slots from editable axis-aligned endpoint parameters
  - Create two arc Slots from fixed authored points
  - Drive all five Slot widths from one editable native width parameter
  - Cut the complete Slot family through the plate once
